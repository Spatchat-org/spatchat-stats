name: Sync to Hugging Face Space

# Every push to main updates https://huggingface.co/spaces/hoyiwan/spatchat-stats.
# Plain (non-force) push: if someone edited the Space directly, this fails instead of
# overwriting their work. Pull the Space into main first, then push again.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-hf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.SPATCHAT }}
        run: |
          test -n "$HF_TOKEN" || { echo "Add the SPATCHAT secret (a Hugging Face write token)"; exit 1; }
          git push "https://user:${HF_TOKEN}@huggingface.co/spaces/hoyiwan/spatchat-stats" HEAD:main
